name: chapur_ia
description: Sales force mobile application for Chapur S.A.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5
  dartz: ^0.10.1
  dio: ^5.3.3
  get_it: ^7.6.4
  shared_preferences: ^2.2.1
  flutter_secure_storage: ^9.0.0
  json_annotation: ^4.8.1
  intl: ^0.18.1
  path_provider: ^2.1.1
  share_plus: ^7.1.0
  open_filex: ^4.3.2
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/tcm_logo_splash_ios.png"
  android_12:
    image: "assets/images/tcm_logo_splash.png"
    color: "#FFFFFF"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/tcm_logo.png"
  image_path_ios: "assets/images/tcm_logo_ios_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
